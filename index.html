<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>변경백</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c" width="1200" height="800"></canvas>
    <div id="result" class="overlay hidden">
      <div class="panel">
        <h1 id="resTitle"></h1>
        <div id="resBody"></div>
        <div class="row">
          <button class="main" id="contBtn">정비 화면으로</button>
        </div>
      </div>
    </div>
  </div>
  <div id="side">
    <div class="card" id="statusCard"></div>
    <div class="card">
      <h3>성벽과 본성</h3>
      <div id="walls"></div>
    </div>
    <div class="card" id="scoutCard"></div>
    <div class="card" id="garrisonCard"></div>
    <div class="card">
      <h3>부대</h3>
      <div id="squads"></div>
    </div>
    <div class="card">
      <button class="main" id="startBtn">전투 시작</button>
      <div class="row">
        <button id="pauseBtn">일시정지</button>
        <button id="speedBtn">속도 x1</button>
      </div>
    </div>
    <div class="card keys">
      좌클릭/드래그: 부대 선택 · Shift: 추가 선택<br>
      우클릭: 이동 · 적 우클릭: 집중 공격<br>
      성벽 위를 우클릭하면 성벽을 따라 한 줄로 서요<br>
      Ctrl+1~9: 부대 지정 · 1~9: 불러오기<br>
      Space: 일시정지 (멈춘 채로 명령 가능) · Esc: 선택 해제<br>
      휠: 확대·축소 · 가운데 버튼 드래그 / WASD / 방향키: 화면 이동 · H: 성으로
    </div>
  </div>
</div>
<div id="camp" class="hidden"></div>
<script src="js/data.js"></script>
<script src="js/campaign.js"></script>
<script src="js/battle.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/camp-ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
